site_name: godot-scala-native
site_description: Write Godot 4 game classes in Scala, compiled to a native GDExtension with Scala Native.
site_url: https://optical002.github.io/godot-scala-native/
repo_url: https://github.com/optical002/godot-scala-native
repo_name: optical002/godot-scala-native
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Install the toolchain: getting-started/install.md
      - Create a project: getting-started/new-project.md
      - Your first class: getting-started/first-class.md
  - Guides:
      - Game classes: guides/classes.md
      - Exported properties: guides/properties.md
      - Export hints and sections: guides/export-hints.md
      - Methods and signals: guides/methods-signals.md
      - Builtin types: guides/builtin-types.md
      - Resources and files: guides/resources-files.md
      - Input: guides/input.md
      - Memory and object lifetimes: guides/memory.md
      - Performance: guides/performance.md
      - Editor hot reload: guides/hot-reload.md
  - Reference:
      - sbt plugin: reference/sbt-plugin.md
      - Artifacts and versions: reference/artifacts.md
      - API (Scaladoc): reference/api.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Changelog: changelog.md
